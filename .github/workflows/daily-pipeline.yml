# Re 2026/05/19/14:48
# name: Daily AI Model Pipeline
# description: 每天北京时间8点自动运行模型追踪流水线，产出日报JSON部署到gh-pages

name: Daily AI Model Pipeline

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '起始日期 (YYYYMMDD)，留空=昨天'
        required: false
      until:
        description: '截止日期 (YYYYMMDD)，留空=今天'
        required: false

permissions:
  contents: write
  pages: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd Model_Navigate
          pip install -r requirements.txt

      - name: Calculate date range
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            echo "since=${{ github.event.inputs.since }}" >> $GITHUB_OUTPUT
          else
            # 定时触发：跑昨天一整天的数据
            echo "since=$(date -d 'yesterday' +%Y%m%d)" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ github.event.inputs.until }}" ]; then
            echo "until=${{ github.event.inputs.until }}" >> $GITHUB_OUTPUT
          else
            # 定时触发：until 也是昨天（跑昨天一整天）
            echo "until=$(date -d 'yesterday' +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline (no push)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_BASE: ${{ secrets.DASHSCOPE_API_BASE }}
          KUAI_API_KEY: ${{ secrets.KUAI_API_KEY }}
          KUAI_API_BASE: ${{ secrets.KUAI_API_BASE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd Model_Navigate
          python main.py --since ${{ steps.dates.outputs.since }} --until ${{ steps.dates.outputs.until }}

      - name: Generate site data (JSON for gh-pages)
        run: |
          cd Model_Navigate
          python generate_site_data.py --since ${{ steps.dates.outputs.since }} --until ${{ steps.dates.outputs.until }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true

      - name: Commit updated data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Model_Navigate/data/ Model_Navigate/Extract/ Model_Navigate/Crawl/ docs/data/
          git diff --staged --quiet || git commit -m "chore(auto): daily pipeline $(date +%Y-%m-%d)"
          git push
