# Re 2026/05/20/11:04
# name: Review Daily Report
# description: 手动触发日报巡检修正：调用 LLM 审核当日日报，移除不属于时间窗口的模型，修正错误信息

name: Review Daily Report

on:
  workflow_dispatch:
    inputs:
      since:
        description: '日报起始日期 (YYYYMMDD)，留空=使用最新日报的时间范围'
        required: false
      until:
        description: '日报截止日期 (YYYYMMDD)，留空=使用最新日报的时间范围'
        required: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd Model_Navigate
          pip install -r requirements.txt

      - name: Run review on daily report
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cd Model_Navigate
          ARGS=""
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          if [ -n "${{ github.event.inputs.until }}" ]; then
            ARGS="$ARGS --until ${{ github.event.inputs.until }}"
          fi
          python review_daily.py $ARGS

      - name: Regenerate site data
        run: |
          cd Model_Navigate
          # 读取日报的时间范围重新生成
          SINCE=$(python -c "import json; d=json.load(open('../docs/data/daily_report.json')); print(d['meta']['since'].replace('-',''))")
          UNTIL=$(python -c "import json; d=json.load(open('../docs/data/daily_report.json')); print(d['meta']['until'].replace('-',''))")
          python generate_site_data.py --since $SINCE --until $UNTIL

      - name: Commit reviewed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Model_Navigate/data/ docs/data/
          git diff --staged --quiet || git commit -m "chore(review): daily report reviewed $(date +%Y-%m-%d)"
          git push
