# 2026/06/01/15:47
# name: Data Ops Proxy
# description: 前端数据操作代理；由 GitHub Actions 在仓库内执行删除、恢复、彻底清除、日报同步总表并提交，避免 GitHub Pages 前端直写 Contents API
# prompt: 用户确认将删除/恢复/同步等写仓库动作迁移到 GitHub Actions 代理，解决浏览器直连 api.github.com 导致删除失败的问题。

name: Data Ops Proxy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '操作类型'
        required: true
        type: choice
        options:
          - delete_model
          - restore_model
          - purge_recycle
          - sync_daily_to_all
      model_name:
        description: '模型名称（删除/恢复/彻底清除时必填）'
        required: false
        type: string
      source:
        description: '来源：all=总表，daily=日报'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
      source_path:
        description: '日报源文件路径，如 docs/data/daily_report.json 或 docs/data/history/xxx.json'
        required: false
        type: string
      start_date:
        description: '同步开始日期 YYYY-MM-DD'
        required: false
        type: string
      end_date:
        description: '同步结束日期 YYYY-MM-DD'
        required: false
        type: string

permissions:
  contents: write

jobs:
  data-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data operation
        run: |
          python Model_Navigate/20260601_1547_data_ops.py \
            --operation "${{ github.event.inputs.operation }}" \
            --model-name "${{ github.event.inputs.model_name }}" \
            --source "${{ github.event.inputs.source }}" \
            --source-path "${{ github.event.inputs.source_path }}" \
            --start-date "${{ github.event.inputs.start_date }}" \
            --end-date "${{ github.event.inputs.end_date }}"

      - name: Commit and push
        run: |
          git config user.name "data-ops-bot"
          git config user.email "bot@ai-models-tracker.local"
          git add docs/data/all_models.json docs/data/daily_report.json docs/data/recycle.json docs/data/history_index.json docs/data/history || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data-ops): ${{ github.event.inputs.operation }} ${{ github.event.inputs.model_name }}"
            git push
          fi
