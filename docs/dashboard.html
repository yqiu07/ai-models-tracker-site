<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 — Model Navigate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --success: #16a34a;
            --warning: #d97706;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            padding: 32px 20px;
            text-align: center;
            margin-bottom: 24px;
            border-radius: 12px;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        header p { opacity: 0.9; font-size: 0.95rem; }
        nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        nav a {
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card h3 { font-size: 1rem; margin-bottom: 16px; color: var(--text); }
        .chart-wrapper { position: relative; height: 280px; }
        footer { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 0.85rem; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        @media (max-width: 600px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 模型仪表盘</h1>
            <p>Model Navigate — 全局数据统计与趋势</p>
        </header>

        <nav>
            <a href="index.html">📋 日报</a>
            <a href="dashboard.html" class="active">📊 仪表盘</a>
        </nav>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card"><div class="value" id="stat-total">-</div><div class="label">总模型数</div></div>
            <div class="stat-card"><div class="value" id="stat-recent">-</div><div class="label">最近7天新增</div></div>
            <div class="stat-card"><div class="value" id="stat-domestic">-</div><div class="label">国内模型</div></div>
            <div class="stat-card"><div class="value" id="stat-foreign">-</div><div class="label">国外模型</div></div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 模型发布月度趋势</h3>
                <div class="chart-wrapper"><canvas id="trend-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>🏷️ 模型类型分布</h3>
                <div class="chart-wrapper"><canvas id="type-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>🌐 国内外分布</h3>
                <div class="chart-wrapper"><canvas id="domestic-chart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>🔓 开闭源分布</h3>
                <div class="chart-wrapper"><canvas id="opensource-chart"></canvas></div>
            </div>
        </div>

        <footer>
            <p>数据来源：llm-stats.com · 腾讯研究院AI速递 · HuggingFace</p>
            <p id="generated-at"></p>
        </footer>
    </div>

    <script>
        const DATA_URL = './data/dashboard.json';

        const CHART_COLORS = [
            '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#16a34a',
            '#0891b2', '#4f46e5', '#c026d3', '#65a30d', '#0d9488'
        ];

        async function loadDashboard() {
            try {
                const resp = await fetch(DATA_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                renderDashboard(data);
            } catch (err) {
                document.getElementById('stats-grid').innerHTML =
                    `<div class="stat-card" style="grid-column:1/-1;text-align:center;padding:40px;">
                        <p>⚠️ 数据加载失败：${err.message}</p>
                        <p style="color:var(--text-muted);margin-top:8px;">请等待首次流水线运行生成数据</p>
                    </div>`;
            }
        }

        function renderDashboard(data) {
            document.getElementById('stat-total').textContent = data.total || 0;
            document.getElementById('stat-recent').textContent = data.recent_7d || 0;
            document.getElementById('stat-domestic').textContent = data.by_domestic?.['国内'] || 0;
            document.getElementById('stat-foreign').textContent = data.by_domestic?.['国外'] || 0;
            document.getElementById('generated-at').textContent = `更新时间: ${data.generated_at || ''}`;

            renderTrendChart(data.trend || []);
            renderPieChart('type-chart', data.by_type || {});
            renderPieChart('domestic-chart', data.by_domestic || {});
            renderPieChart('opensource-chart', data.by_open_source || {});
        }

        function renderTrendChart(trend) {
            const ctx = document.getElementById('trend-chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: trend.map(item => item.month),
                    datasets: [{
                        label: '新增模型数',
                        data: trend.map(item => item.count),
                        backgroundColor: '#2563eb88',
                        borderColor: '#2563eb',
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderPieChart(canvasId, dataObj) {
            const labels = Object.keys(dataObj);
            const values = Object.values(dataObj);
            if (labels.length === 0) return;

            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: CHART_COLORS.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#ffffff',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { boxWidth: 12, padding: 12, font: { size: 12 } }
                        }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
