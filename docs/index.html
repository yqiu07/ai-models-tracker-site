<!-- Re 2026/05/19/18:05 -->
<!-- name: AI Models Tracker — Single Page Application -->
<!-- description: 展示 AI 模型追踪流水线核心产出的单页应用，包含日报/总表/仪表盘/数据源/推送/README六大模块 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Models Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root{--primary:#4f46e5;--primary-light:#6366f1;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-sec:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);--radius:12px;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1e1b4b,#312e81,#4338ca);padding:16px 24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.header h1{color:#fff;font-size:1.4rem;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border-radius:8px;cursor:pointer;font-size:.9rem;transition:all .2s}
.tab-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.tab-btn.active{background:rgba(255,255,255,.95);color:var(--primary);font-weight:600}
.container{max-width:1400px;margin:0 auto;padding:24px}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-md)}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.model-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;transition:transform .2s,box-shadow .2s}
.model-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.model-card h3{font-size:1rem;margin-bottom:8px}
.model-card h3 a{color:var(--primary);text-decoration:none}
.model-card h3 a:hover{text-decoration:underline}
.model-card .company{color:var(--text-sec);font-size:.85rem;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:500}
.tag-domestic{background:#dbeafe;color:#1d4ed8}
.tag-foreign{background:#fef3c7;color:#92400e}
.tag-open{background:#d1fae5;color:#065f46}
.tag-closed{background:#fee2e2;color:#991b1b}
.tag-type{background:#f3e8ff;color:#6b21a8}
.tag-size{background:#e0e7ff;color:#3730a3}
.meta-info{font-size:.8rem;color:var(--text-sec)}
.note{font-size:.8rem;color:var(--text-sec);margin-top:6px;font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.controls select,.controls input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:#fff}
.controls input{min-width:200px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:1600px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#f1f5f9;font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{background:#e2e8f0}
tr:hover{background:#f8fafc}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
.stat-card .number{font-size:2rem;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:.85rem;color:var(--text-sec);margin-top:4px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px}
.chart-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.chart-card h3{margin-bottom:16px;font-size:1rem}
.source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.source-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.source-card h3{margin-bottom:8px}
.source-card .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.status-active{background:#d1fae5;color:#065f46}
.status-suspended{background:#fee2e2;color:#991b1b}
.source-card .desc{color:var(--text-sec);font-size:.9rem;margin:8px 0}
.source-card a{color:var(--primary);font-size:.85rem}
.push-section{text-align:center;padding:60px 20px}
.push-section h2{margin-bottom:16px}
.push-section p{color:var(--text-sec);margin-bottom:24px}
.push-btn{display:inline-block;padding:12px 32px;background:var(--primary);color:#fff;text-decoration:none;border-radius:8px;font-weight:600;transition:background .2s}
.push-btn:hover{background:var(--primary-light)}
.readme-content{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;line-height:1.8}
.readme-content h1,.readme-content h2,.readme-content h3{margin:1em 0 .5em}
.readme-content code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.9em}
.readme-content pre{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;overflow-x:auto;margin:1em 0}
.readme-content table{border-collapse:collapse;width:100%;margin:1em 0}
.readme-content table th,.readme-content table td{border:1px solid var(--border);padding:8px 12px}
.readme-content a{color:var(--primary)}
.readme-content ul,.readme-content ol{padding-left:2em}
.footer{text-align:center;padding:24px;color:var(--text-sec);font-size:.85rem;border-top:1px solid var(--border);margin-top:40px}
.footer a{color:var(--primary);text-decoration:none}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.4}
.count-info{font-size:.9rem;color:var(--text-sec);margin-bottom:12px}
@media(max-width:768px){
  .header{padding:12px 16px}.header h1{font-size:1.1rem}
  .tab-btn{padding:6px 12px;font-size:.8rem}
  .container{padding:16px}
  .model-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .charts-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;align-items:stretch}
  .controls input{min-width:auto}
}
</style>
</head>
<body>
<header class="header">
  <h1>🤖 AI Models Tracker</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="daily">日报</button>
    <button class="tab-btn" data-tab="all">总表</button>
    <button class="tab-btn" data-tab="dashboard">仪表盘</button>
    <button class="tab-btn" data-tab="sources">数据源</button>
    <button class="tab-btn" data-tab="push">推送</button>
    <button class="tab-btn" data-tab="readme">README</button>
  </nav>
</header>
<main class="container">
  <section id="tab-daily" class="tab-content active">
    <div class="controls">
      <select id="history-select"><option value="">当前日报</option></select>
    </div>
    <div class="count-info" id="daily-meta"></div>
    <div class="model-grid" id="daily-grid"></div>
  </section>
  <section id="tab-all" class="tab-content">
    <div class="controls">
      <input type="text" id="search-input" placeholder="搜索模型名称、公司、备注...">
      <select id="filter-domestic"><option value="">国内外: 全部</option><option value="国内">国内</option><option value="国外">国外</option></select>
      <select id="filter-source"><option value="">开闭源: 全部</option><option value="开源">开源</option><option value="闭源">闭源</option></select>
      <select id="filter-type"><option value="">类型: 全部</option></select>
    </div>
    <div class="count-info" id="all-count"></div>
    <div class="table-wrap">
      <table id="all-table"><thead><tr id="all-thead"></tr></thead><tbody id="all-tbody"></tbody></table>
    </div>
  </section>
  <section id="tab-dashboard" class="tab-content">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="charts-grid">
      <div class="chart-card"><h3>📈 月度新增趋势</h3><canvas id="trend-chart"></canvas></div>
      <div class="chart-card"><h3>🧩 类型分布</h3><canvas id="type-chart"></canvas></div>
    </div>
  </section>
  <section id="tab-sources" class="tab-content">
    <div class="source-grid" id="source-grid"></div>
  </section>
  <section id="tab-push" class="tab-content">
    <div class="push-section card">
      <h2>📤 钉钉推送</h2>
      <p>通过 GitHub Actions 手动触发，将最新日报推送到钉钉群</p>
      <a class="push-btn" href="https://github.com/yqiu07/ai-models-tracker-site/actions/workflows/push-dingtalk.yml" target="_blank" rel="noopener">前往 GitHub Actions 触发推送</a>
    </div>
  </section>
  <section id="tab-readme" class="tab-content">
    <div class="readme-content" id="readme-content">加载中...</div>
  </section>
</main>
<footer class="footer">
  <p>数据来源: AI Models Tracker Pipeline | <span id="footer-time"></span> | <a href="https://github.com/yqiu07/ai-models-tracker-site" target="_blank">GitHub</a></p>
</footer>
<script>
(function() {
  'use strict';
  var COLS = ['模型名称','是否接入','workflow进展','公司','国内外','开闭源','尺寸','类型','能否推理','任务类型','官网','备注','发布时间','记录创建时间','是否新增','核实情况'];
  var FIELDS = ['name','connected','workflow_progress','company','domestic','open_source','size','type','reasoning','task_type','website','note','release_date','created_date','is_new','status'];
  var allModelsData = [];
  var filteredModels = [];
  var sortCol = -1;
  var sortAsc = true;
  var trendChart = null;
  var typeChart = null;

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  function fetchJSON(url) {
    return fetch(url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  }

  function safe(val) {
    if (val === null || val === undefined) return '';
    var s = String(val).trim();
    if (s === 'nan' || s === 'NaN' || s === 'None' || s === 'undefined' || s === 'null') return '';
    return s;
  }

  function renderTags(model) {
    var html = '';
    var dom = safe(model.domestic);
    if (dom) html += '<span class="tag ' + (dom === '\u56fd\u5185' ? 'tag-domestic' : 'tag-foreign') + '">' + dom + '</span>';
    var os = safe(model.open_source);
    if (os) html += '<span class="tag ' + (os === '\u5f00\u6e90' ? 'tag-open' : 'tag-closed') + '">' + os + '</span>';
    var tp = safe(model.type);
    if (tp) html += '<span class="tag tag-type">' + tp + '</span>';
    var sz = safe(model.size);
    if (sz) html += '<span class="tag tag-size">' + sz + '</span>';
    return html;
  }

  function renderModelCard(model) {
    var name = safe(model.name) || '\u672a\u547d\u540d';
    var website = safe(model.website);
    var nameHtml = website ? '<a href="' + website + '" target="_blank" rel="noopener">' + name + '</a>' : name;
    var company = safe(model.company);
    var releaseDate = safe(model.release_date);
    var note = safe(model.note);
    var html = '<div class="model-card"><h3>' + nameHtml + '</h3>';
    if (company) html += '<div class="company">' + company + '</div>';
    html += '<div class="tags">' + renderTags(model) + '</div>';
    if (releaseDate) html += '<div class="meta-info">\u53d1\u5e03: ' + releaseDate + '</div>';
    if (note) html += '<div class="note">' + note + '</div>';
    html += '</div>';
    return html;
  }

  function emptyState(msg) {
    return '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg><p>' + msg + '</p></div>';
  }

  // ===== Daily Report =====
  function loadDaily(url) {
    fetchJSON(url || 'data/daily_report.json').then(function(data) {
      var grid = document.getElementById('daily-grid');
      var meta = document.getElementById('daily-meta');
      if (!data || !data.models || data.models.length === 0) {
        grid.innerHTML = emptyState('\u6682\u65e0\u65e5\u62a5\u6570\u636e');
        meta.textContent = '';
        return;
      }
      var m = data.meta || {};
      var parts = [];
      if (m.since && m.until) parts.push('\u65f6\u95f4\u8303\u56f4: ' + m.since + ' ~ ' + m.until);
      parts.push('\u6a21\u578b\u6570\u91cf: ' + data.models.length);
      meta.textContent = parts.join(' | ');
      grid.innerHTML = data.models.map(renderModelCard).join('');
    });
  }

  fetchJSON('data/history_index.json').then(function(data) {
    if (!data || !data.length) return;
    var sel = document.getElementById('history-select');
    data.forEach(function(item) {
      var opt = document.createElement('option');
      opt.value = 'data/' + item.file;
      opt.textContent = item.label || (item.since + ' ~ ' + item.until);
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function() {
      loadDaily(sel.value || 'data/daily_report.json');
    });
  });
  loadDaily();

  // ===== All Models =====
  function loadAllModels() {
    fetchJSON('data/all_models.json').then(function(data) {
      if (!data || !data.models) return;
      allModelsData = data.models;
      var types = {};
      allModelsData.forEach(function(m) { var t = safe(m.type); if (t) types[t] = true; });
      var typeSel = document.getElementById('filter-type');
      Object.keys(types).sort().forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        typeSel.appendChild(opt);
      });
      applyFilters();
    });
  }

  function applyFilters() {
    var query = document.getElementById('search-input').value.toLowerCase();
    var dom = document.getElementById('filter-domestic').value;
    var src = document.getElementById('filter-source').value;
    var tp = document.getElementById('filter-type').value;
    filteredModels = allModelsData.filter(function(m) {
      if (dom && safe(m.domestic) !== dom) return false;
      if (src && safe(m.open_source) !== src) return false;
      if (tp && safe(m.type) !== tp) return false;
      if (query) {
        var haystack = [safe(m.name), safe(m.company), safe(m.note)].join(' ').toLowerCase();
        if (haystack.indexOf(query) === -1) return false;
      }
      return true;
    });
    if (sortCol >= 0) sortModels();
    renderTable();
  }

  function sortModels() {
    var field = FIELDS[sortCol];
    filteredModels.sort(function(a, b) {
      var va = safe(a[field]);
      var vb = safe(b[field]);
      if (!va && !vb) return 0;
      if (!va) return 1;
      if (!vb) return -1;
      var cmp = va.localeCompare(vb, 'zh');
      return sortAsc ? cmp : -cmp;
    });
  }

  function renderTable() {
    var countEl = document.getElementById('all-count');
    countEl.textContent = '\u663e\u793a ' + filteredModels.length + ' / ' + allModelsData.length + ' \u6761';
    var thead = document.getElementById('all-thead');
    thead.innerHTML = COLS.map(function(col, i) {
      var arrow = (i === sortCol) ? (sortAsc ? ' \u2191' : ' \u2193') : '';
      return '<th data-col="' + i + '">' + col + arrow + '</th>';
    }).join('');
    thead.querySelectorAll('th').forEach(function(th) {
      th.addEventListener('click', function() {
        var ci = parseInt(th.getAttribute('data-col'));
        if (sortCol === ci) { sortAsc = !sortAsc; } else { sortCol = ci; sortAsc = true; }
        sortModels();
        renderTable();
      });
    });
    var tbody = document.getElementById('all-tbody');
    if (filteredModels.length === 0) {
      tbody.innerHTML = '<tr><td colspan="16" style="text-align:center;padding:40px;color:var(--text-sec)">\u65e0\u5339\u914d\u6570\u636e</td></tr>';
      return;
    }
    tbody.innerHTML = filteredModels.map(function(m) {
      return '<tr>' + FIELDS.map(function(f) {
        var v = safe(m[f]);
        if (f === 'website' && v) return '<td><a href="' + v + '" target="_blank" rel="noopener">\u94fe\u63a5</a></td>';
        return '<td>' + v + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }

  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('filter-domestic').addEventListener('change', applyFilters);
  document.getElementById('filter-source').addEventListener('change', applyFilters);
  document.getElementById('filter-type').addEventListener('change', applyFilters);
  loadAllModels();

  // ===== Dashboard =====
  function loadDashboard() {
    fetchJSON('data/dashboard.json').then(function(data) {
      if (!data) return;
      var statsGrid = document.getElementById('stats-grid');
      var domesticCount = (data.by_domestic && data.by_domestic['\u56fd\u5185']) || 0;
      var foreignCount = (data.by_domestic && data.by_domestic['\u56fd\u5916']) || 0;
      var items = [
        { n: data.total || 0, l: '\u603b\u6a21\u578b\u6570' },
        { n: data.recent_7d || 0, l: '\u6700\u8fd17\u5929\u65b0\u589e' },
        { n: domesticCount, l: '\u56fd\u5185\u6a21\u578b' },
        { n: foreignCount, l: '\u56fd\u5916\u6a21\u578b' }
      ];
      statsGrid.innerHTML = items.map(function(s) {
        return '<div class="stat-card"><div class="number">' + s.n + '</div><div class="label">' + s.l + '</div></div>';
      }).join('');
      if (data.trend && data.trend.length) {
        var ctx1 = document.getElementById('trend-chart').getContext('2d');
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(ctx1, {
          type: 'bar',
          data: { labels: data.trend.map(function(t) { return t.month; }), datasets: [{ label: '\u65b0\u589e\u6a21\u578b\u6570', data: data.trend.map(function(t) { return t.count; }), backgroundColor: 'rgba(79,70,229,0.7)', borderRadius: 6 }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
      }
      if (data.by_type) {
        var labels = Object.keys(data.by_type);
        var values = labels.map(function(k) { return data.by_type[k]; });
        var colors = ['#4f46e5','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];
        var ctx2 = document.getElementById('type-chart').getContext('2d');
        if (typeChart) typeChart.destroy();
        typeChart = new Chart(ctx2, {
          type: 'doughnut',
          data: { labels: labels, datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length) }] },
          options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
      }
      if (data.generated_at) document.getElementById('footer-time').textContent = '\u66f4\u65b0: ' + data.generated_at;
    });
  }
  loadDashboard();

  // ===== Data Sources & README =====
  function loadSources() {
    fetchJSON('data/site_meta.json').then(function(data) {
      if (!data) return;
      if (data.data_sources) {
        var grid = document.getElementById('source-grid');
        grid.innerHTML = data.data_sources.map(function(src) {
          var statusCls = src.status === 'active' ? 'status-active' : 'status-suspended';
          var statusText = src.status === 'active' ? '\u8fd0\u884c\u4e2d' : '\u5df2\u6682\u505c';
          var html = '<div class="source-card"><h3>' + safe(src.name) + ' <span class="status ' + statusCls + '">' + statusText + '</span></h3>';
          html += '<p class="desc">' + safe(src.description) + '</p>';
          if (src.url) html += '<a href="' + src.url + '" target="_blank" rel="noopener">\u8bbf\u95ee\u94fe\u63a5 \u2192</a>';
          html += '</div>';
          return html;
        }).join('');
      }
      if (data.readme) {
        document.getElementById('readme-content').innerHTML = marked.parse(data.readme);
      } else {
        document.getElementById('readme-content').innerHTML = '<p>\u6682\u65e0 README \u5185\u5bb9</p>';
      }
      if (data.generated_at && !document.getElementById('footer-time').textContent) {
        document.getElementById('footer-time').textContent = '\u66f4\u65b0: ' + data.generated_at;
      }
    });
  }
  loadSources();
})();
</script>
</body>
</html>
