<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Models Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root {
  --primary: #4f46e5; --primary-light: #6366f1; --bg: #f8fafc; --card-bg: #fff;
  --text: #1e293b; --text-sec: #64748b; --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --radius: 12px; --green: #10b981; --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca); padding: 16px 24px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.header h1 { color: #fff; font-size: 1.4rem; margin-bottom: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab-btn { padding: 8px 16px; border: none; background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); border-radius: 8px; cursor: pointer; font-size: .9rem; transition: all .2s; }
.tab-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
.tab-btn.active { background: rgba(255,255,255,.95); color: var(--primary); font-weight: 600; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; transition: box-shadow .2s; }
.card:hover { box-shadow: var(--shadow-md); }
.report-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.report-header select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; background: #fff; }
.report-meta { color: var(--text-sec); font-size: .9rem; }
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.model-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; transition: transform .2s, box-shadow .2s; }
.model-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.model-card h3 { font-size: 1rem; margin-bottom: 8px; }
.model-card h3 a { color: var(--primary); text-decoration: none; }
.model-card h3 a:hover { text-decoration: underline; }
.model-card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.model-card .meta-line { font-size: .85rem; color: var(--text-sec); margin-bottom: 4px; }
.model-card .note-text { font-size: .85rem; color: var(--text-sec); line-height: 1.4; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; line-height: 1.4; white-space: nowrap; }
.badge-domestic { background: #fef3c7; color: #92400e; }
.badge-foreign { background: #3b82f6; color: #fff; }
.badge-open { background: #10b981; color: #fff; }
.badge-closed { background: #8b5cf6; color: #fff; }
.badge-type { background: #f1f5f9; color: #475569; }
.badge-new { background: #fee2e2; color: #dc2626; }
.table-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.table-controls input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; min-width: 200px; }
.table-controls select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; background: #fff; }
.table-count { font-size: .85rem; color: var(--text-sec); margin-left: auto; }
.mode-switch { display: flex; gap: 4px; }
.mode-btn { padding: 6px 14px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-size: .85rem; transition: all .2s; }
.mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { background: #f8fafc; padding: 8px 8px; text-align: left; font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1; }
.data-table th:hover { background: #e2e8f0; }
.data-table th .sort-arrow { margin-left: 4px; font-size: 10px; color: #94a3b8; }
.data-table td { padding: 6px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; line-height: 1.4; }
.data-table tr:hover td { background: #f8fafc; }
.note-cell { width: 180px; max-width: 180px; min-width: 180px; padding: 0 !important; }
.note-scroll { max-height: 60px; overflow-y: auto; padding: 6px 8px; font-size: 11px; line-height: 1.3; word-break: break-all; }
.note-scroll::-webkit-scrollbar { width: 4px; }
.note-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
.data-table a { color: var(--primary); text-decoration: none; }
.data-table a:hover { text-decoration: underline; }
.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.page-btn { padding: 6px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-size: .85rem; }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: .5; cursor: not-allowed; }
.inline-table-wrapper { max-height: 80vh; overflow: auto; border-radius: 8px; border: 1px solid var(--border); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; text-align: center; }
.stat-card .stat-num { font-size: 2rem; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: .9rem; color: var(--text-sec); margin-top: 4px; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.chart-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.chart-card h3 { margin-bottom: 16px; font-size: 1rem; }
.chart-card canvas { width: 100% !important; max-height: 350px; }
.source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.source-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.source-card h3 { font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.source-card .desc { font-size: .85rem; color: var(--text-sec); margin-bottom: 10px; line-height: 1.5; }
.source-card a.source-link { color: var(--primary); text-decoration: none; font-size: .85rem; }
.source-card a.source-link:hover { text-decoration: underline; }
.status-active { background: var(--green); color: #fff; }
.status-suspended { background: var(--red); color: #fff; }
.sub-sources { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.sub-sources h4 { font-size: .85rem; color: var(--text-sec); margin-bottom: 8px; }
.sub-source-item { padding: 6px 0; font-size: .85rem; border-bottom: 1px solid #f1f5f9; }
.sub-source-item:last-child { border-bottom: none; }
.sub-source-item a { color: var(--primary); text-decoration: none; }
.daily-actions { display: flex; gap: 8px; margin-left: auto; }
.action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .2s; }
.review-btn { background: #f59e0b; color: #fff; }
.review-btn:hover { background: #d97706; }
.push-btn-small { background: var(--primary); color: #fff; }
.push-btn-small:hover { background: var(--primary-light); }
.readme-content { line-height: 1.8; }
.readme-content h1 { font-size: 1.5rem; margin: 24px 0 12px; }
.readme-content h2 { font-size: 1.3rem; margin: 20px 0 10px; }
.readme-content h3 { font-size: 1.1rem; margin: 16px 0 8px; }
.readme-content p { margin-bottom: 12px; }
.readme-content ul, .readme-content ol { padding-left: 24px; margin-bottom: 12px; }
.readme-content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
.readme-content pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }
.readme-content pre code { background: none; padding: 0; color: inherit; }
.footer { text-align: center; padding: 24px; color: var(--text-sec); font-size: .85rem; border-top: 1px solid var(--border); margin-top: 32px; }
.footer a { color: var(--primary); text-decoration: none; }
.footer a:hover { text-decoration: underline; }
/* Recycle bin */
.recycle-btn { background: #64748b; color: #fff; position: relative; }
.recycle-btn:hover { background: #475569; }
.recycle-badge { background: var(--red); color: #fff; border-radius: 50%; font-size: 11px; padding: 1px 5px; margin-left: 4px; }
.recycle-panel { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
.recycle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.recycle-header .close-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #64748b; }
.recycle-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border-radius: 6px; margin-bottom: 6px; font-size: .85rem; }
.recycle-item .model-info { flex: 1; }
.recycle-item .restore-btn { background: var(--green); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: .8rem; }
.recycle-item .restore-btn:hover { background: #059669; }
.delete-btn-cell { background: var(--red); color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: .75rem; }
.delete-btn-cell:hover { background: #dc2626; }
.connect-btn-cell { background: var(--green); color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: .75rem; }
.connect-btn-cell:hover { background: #059669; }
/* Connected panel */
.connected-btn { background: var(--green); color: #fff; position: relative; }
.connected-btn:hover { background: #059669; }
.connected-badge { background: #065f46; color: #fff; border-radius: 50%; font-size: 11px; padding: 1px 5px; margin-left: 4px; }
.connected-panel { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
.connected-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.connected-header .close-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #64748b; }
.connected-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border-radius: 6px; margin-bottom: 6px; font-size: .85rem; }
.connected-item .model-info { flex: 1; }
.connected-item .disconnect-btn { background: var(--orange); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: .8rem; }
.connected-item .disconnect-btn:hover { background: #d97706; }
/* Add buttons */
.add-manual-btn { background: #6366f1; color: #fff; }
.add-manual-btn:hover { background: #4f46e5; }
.add-smart-btn { background: #8b5cf6; color: #fff; }
.add-smart-btn:hover { background: #7c3aed; }
/* Add modal form */
.add-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.add-form-grid label { font-size: .8rem; color: var(--text-sec); display: block; margin-bottom: 3px; }
.add-form-grid input, .add-form-grid select, .add-form-grid textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .85rem; }
.add-form-grid textarea { resize: vertical; min-height: 50px; }
.add-form-grid .full-width { grid-column: 1 / -1; }
.smart-add-textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; resize: vertical; margin-bottom: 12px; font-family: inherit; }
/* Update button */
.update-btn { background: var(--blue); color: #fff; }
.update-btn:hover { background: #2563eb; }
/* Update modal */
.update-modal input[type="date"] { width: 45%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: .9rem; }
.update-modal .date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
.update-modal .progress-bar { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 12px; overflow: hidden; }
.update-modal .progress-fill { height: 100%; background: var(--blue); width: 0%; transition: width .3s; }
/* Token modal */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.modal-box { background: #fff; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-box h3 { margin-bottom: 12px; }
.modal-box p { font-size: .85rem; color: var(--text-sec); margin-bottom: 12px; line-height: 1.5; }
.modal-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; margin-bottom: 16px; }
.modal-box .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
.modal-box button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
.modal-box .btn-primary { background: var(--primary); color: #fff; }
.modal-box .btn-cancel { background: #e2e8f0; color: var(--text); }
/* Table responsive: all columns visible, controlled widths */
.data-table { width: 100%; border-collapse: collapse; font-size: .82rem; table-layout: fixed; }
.data-table th, .data-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; word-wrap: break-word; overflow-wrap: break-word; white-space: normal; vertical-align: top; }
.data-table th { white-space: nowrap; }
/* Column widths */
.col-name { width: 180px; max-width: 180px; }
.col-company { width: 100px; max-width: 100px; }
.col-domestic { width: 55px; max-width: 55px; }
.col-opensource { width: 55px; max-width: 55px; }
.col-size { width: 70px; max-width: 70px; }
.col-type { width: 120px; max-width: 120px; }
.col-reasoning { width: 65px; max-width: 65px; }
.col-tasktype { width: 80px; max-width: 80px; }
.col-website { width: 45px; max-width: 45px; }
.col-note { width: 150px; max-width: 150px; }
.col-release { width: 80px; max-width: 80px; }
.col-created { width: 80px; max-width: 80px; }
.col-action { width: 90px; max-width: 90px; }
.table-wrapper, .inline-table-wrapper { overflow-x: auto; }
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header h1 { font-size: 1.1rem; }
  .tab-btn { padding: 6px 12px; font-size: .8rem; }
  .container { padding: 16px; }
  .chart-grid { grid-template-columns: 1fr; }
  .table-controls { flex-direction: column; align-items: stretch; }
  .table-count { margin-left: 0; }
}
</style>
</head>
<body>
<div class="header">
  <h1>AI Models Tracker</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('daily')">日报</button>
    <button class="tab-btn" onclick="switchTab('all')">总表</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">仪表盘</button>
    <button class="tab-btn" onclick="switchTab('sources')">数据源</button>

  </div>
</div>
<div class="container">
  <div id="tab-daily" class="tab-content active">
    <div class="report-header">
      <label>历史日报：</label>
      <select id="history-select" onchange="loadHistoryReport(this.value)"></select>
      <span id="daily-meta" class="report-meta"></span>
      <div class="daily-actions">
        <button class="action-btn add-manual-btn" onclick="showManualAddModal('daily')">&#x2795; 手动添加</button>
        <button class="action-btn add-smart-btn" onclick="showSmartAddModal('daily')">&#x1F916; 智能添加</button>

        <button class="action-btn review-btn" onclick="triggerReview()">&#9881; 巡检修正</button>

      </div>
    </div>
    <div id="daily-grid" class="model-grid"></div>
  </div>
  <div id="tab-all" class="tab-content">

        <select id="filter-opensource" onchange="filterAllModels()"><option value="">开闭源</option><option value="开源">开源</option><option value="闭源">闭源</option></select>

        <span id="table-count" class="table-count"></span>
        <button class="action-btn add-manual-btn" onclick="showManualAddModal()">&#x2795; 手动添加</button>
        <button class="action-btn add-smart-btn" onclick="showSmartAddModal()">&#x1F916; 智能添加</button>
        <button class="action-btn update-btn" onclick="showUpdateModal()" title="从日报同步总表，并按模型名称查重唯一化">&#x1F504; 同步日报到总表</button>
        <button class="action-btn connected-btn" onclick="toggleConnectedPanel()" title="接入站">&#x1F517; 接入站 <span id="connected-badge" class="connected-badge">0</span></button>
        <button class="action-btn recycle-btn" onclick="toggleRecycleBin()" title="回收站">&#128465; 回收站 <span id="recycle-badge" class="recycle-badge">0</span></button>

      <div id="recycle-panel" class="recycle-panel" style="display:none;">

        <div id="recycle-list"></div>
      </div>
      <div id="connected-panel" class="connected-panel" style="display:none;">
        <div class="connected-header"><strong>&#x1F517; 接入站</strong> <button class="close-btn" onclick="toggleConnectedPanel()">&times;</button></div>

  </div>
  <div class="footer">
    <p>数据来源：AI Models Tracker Pipeline &nbsp;|&nbsp; <span id="footer-time">-</span> &nbsp;|&nbsp; <a href="https://github.com/yqiu07/ai-models-tracker-site" target="_blank" rel="noopener">GitHub</a></p>
  </div>

<script>
/* ===== Utility ===== */
function safe(value) {
  if (value === null || value === undefined) return '';
  var str = String(value);
  if (str === 'nan' || str === 'NaN' || str === 'None' || str === 'null' || str === 'undefined') return '';
  return str.trim();
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function getModelUniqueKey(model) {
  return safe(model && model.name).toLowerCase().replace(/[\s\-_:/（）()【】\[\]]+/g, '');
}

function deduplicateModelsByName(models) {
  var uniqueModels = [];
  var keyToIndex = {};
  var duplicateCount = 0;
  for (var i = 0; i < models.length; i++) {
    var model = models[i];
    var key = getModelUniqueKey(model);
    if (!key) continue;
    if (Object.prototype.hasOwnProperty.call(keyToIndex, key)) {
      uniqueModels[keyToIndex[key]] = Object.assign({}, uniqueModels[keyToIndex[key]], model);
      duplicateCount += 1;
    } else {
      keyToIndex[key] = uniqueModels.length;
      uniqueModels.push(model);
    }
  }
  return { models: uniqueModels, duplicateCount: duplicateCount };
}

function hashColor(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  var hue = Math.abs(hash) % 360;
  return 'hsl(' + hue + ', 55%, 92%)';
}

function hashColorText(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  var hue = Math.abs(hash) % 360;
  return 'hsl(' + hue + ', 50%, 30%)';
}

      '</div>';

    // 自动聚焦输入框
    var inp = _tokenOverlay.querySelector('.token-input-field');

function tokenConfirm() {
  if (!_tokenOverlay) return;

}

function commitFileToGitHub(path, content, message) {
  return getGitHubToken().then(function(token) {
    function putFile(attempt) {
      var apiUrl = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path + '?ref=' + encodeURIComponent(GITHUB_BRANCH) + '&t=' + Date.now();
      return fetch(apiUrl, {
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github.v3+json',
          'Cache-Control': 'no-cache'
        }
      }).then(function(r) { return r.json(); }).then(function(fileInfo) {
        var sha = fileInfo.sha || '';
        var body = { message: message, content: btoa(unescape(encodeURIComponent(content))), branch: GITHUB_BRANCH };
        if (sha) body.sha = sha;
        return fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify(body)
        });
      }).then(function(r) {
        if ((r.status === 409 || r.status === 422) && attempt < 2) {
          return new Promise(function(resolve) { setTimeout(resolve, 800); }).then(function() { return putFile(attempt + 1); });
        }
        if (!r.ok) {
          return r.json().catch(function() { return {}; }).then(function(errorData) {
            throw new Error('GitHub API error: ' + r.status + ' ' + (errorData.message || r.statusText || ''));
          });
        }
        return r.json();
      });
    }
    return putFile(1).catch(function(error) {
      if (error && error.message === 'Failed to fetch') {
        throw new Error('无法连接 GitHub API。请检查当前网络是否能访问 api.github.com，或浏览器是否拦截了跨站请求。');
      }
      throw error;
    });
  });
}

function commitFilesSequentially(tasks) {
  var chain = Promise.resolve();
  for (var i = 0; i < tasks.length; i++) {
    (function(task) {
      chain = chain.then(function() {
        return commitFileToGitHub(task.path, task.content, task.message);
      });
    })(tasks[i]);
  }
  return chain;
}

function buildDataOpsCommand(inputs) {
  var command = 'gh workflow run 20260601_1547-data-ops.yml --repo ' + GITHUB_REPO + ' --ref "' + GITHUB_BRANCH + '"';
  var keys = ['operation', 'model_name', 'source', 'source_path', 'start_date', 'end_date'];
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    if (inputs[key]) command += ' -f ' + key + '="' + String(inputs[key]).replace(/"/g, '\\"') + '"';
  }
  return command;
}

function triggerDataOps(inputs, successMessage) {
  return getGitHubToken().then(function(token) {
    return fetch('https://api.github.com/repos/' + GITHUB_REPO + '/actions/workflows/20260601_1547-data-ops.yml/dispatches', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({ ref: GITHUB_BRANCH, inputs: inputs })
    });
  }).then(function(response) {
    if (response.status === 204 || response.ok) return;
    return response.json().catch(function() { return {}; }).then(function(data) {
      throw new Error(data.message || 'HTTP ' + response.status);
    });
  }).then(function() {
    alert(successMessage + '\nGitHub Actions 正在后台处理，约 1-2 分钟后刷新页面查看结果。');
  }).catch(function(error) {
    if (error === 'cancelled') return;
    var errorMessage = error.message || error;
    var command = buildDataOpsCommand(inputs);
    console.warn('Data Ops Proxy 触发失败，可手动执行：', command, error);
    if (String(errorMessage).indexOf('Resource not accessible by personal access token') >= 0) {
      sessionStorage.removeItem('gh_token');
      alert('后台任务触发失败，未下载任何文件。\n\n原因：当前 Token 缺少 Actions: Read and write 权限。\n我已清除旧 Token；请重新生成/输入带 Actions 权限的 Token 后再试。');
      throw error;
    }
    alert('后台任务触发失败，未下载任何文件。\n失败原因：' + errorMessage + '\n\n如果需要手动兜底，请打开控制台复制 gh workflow run 命令。');
    throw error;
  });
}

    }, '已提交删除日报模型「' + safe(model.name) + '」到后台').then(function() {

    model_name: safe(recycledModel.name),
    source: source,
    source_path: safe(recycledModel.source_path),
    start_date: '',
    end_date: ''
  }, '已提交恢复「' + safe(recycledModel.name) + '」到后台').then(function() {
    var restoredModel = stripRecycleMeta(recycledModel);
    recycleData.splice(idx, 1);
    if (!allModelsData.some(function(model) { return isSameModel(model, restoredModel); })) {
      allModelsData.unshift(restoredModel);
    }
    if (source === 'daily') renderDailyReport(currentDailyData);
    if (tabsLoaded.all) filterAllModels();
    updateRecycleBadge();
    renderRecycleList();
  }).catch(function() {
    renderRecycleList();
  });
}

function permanentlyDeleteModel(idx) {
  var model = recycleData[idx];
  if (!confirm('确定彻底清除「' + safe(model.name) + '」？\n此操作不会恢复到日报或总表。')) return;

  triggerDataOps({
    operation: 'purge_recycle',
    model_name: safe(model.name),
    source: safe(model.source) || 'all',
    source_path: safe(model.source_path),
    start_date: '',
    end_date: ''
  }, '已提交彻底清除「' + safe(model.name) + '」到后台').then(function() {
    recycleData.splice(idx, 1);
    updateRecycleBadge();
    renderRecycleList();
  }).catch(function() {
    renderRecycleList();
  });
}

/* ===== Connected (接入站) ===== */
function updateConnectedBadge() {
  document.getElementById('connected-badge').textContent = connectedData.length;
}

function toggleConnectedPanel() {
  var panel = document.getElementById('connected-panel');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    renderConnectedList();
  } else {
    panel.style.display = 'none';
  }
}

function renderConnectedList() {
  var el = document.getElementById('connected-list');
  if (connectedData.length === 0) {
    el.innerHTML = '<p style="color:#64748b;font-size:.85rem;">接入站为空</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < connectedData.length; i++) {
    var m = connectedData[i];
    html += '<div class="connected-item"><div class="model-info"><strong>' + escapeHtml(safe(m.name)) + '</strong> | ' + escapeHtml(safe(m.company)) + ' | ' + escapeHtml(safe(m.type)) + '</div>';
    html += '<button class="disconnect-btn" onclick="disconnectModel(' + i + ')">移出</button></div>';
  }
  el.innerHTML = html;
}

function connectModel(idx) {
  var model = filteredModels[idx];
  // 检查是否已在接入站
  for (var i = 0; i < connectedData.length; i++) {
    if (connectedData[i].name === model.name) {
      alert('「' + safe(model.name) + '」已在接入站中');
      return;
    }
  }
  if (!confirm('将「' + safe(model.name) + '」标记为已接入？')) return;

  connectedData.push(model);
  updateConnectedBadge();

  var connContent = JSON.stringify({ models: connectedData, meta: { total: connectedData.length, updated_at: new Date().toISOString().replace('T', ' ').substring(0, 19) } }, null, 2);
  commitFileToGitHub('docs/data/connected.json', connContent, 'chore: connect model "' + safe(model.name) + '"').then(function() {
    renderConnectedList();
    alert('已将「' + safe(model.name) + '」加入接入站 ✓');
  }).catch(function(e) {
    if (e === 'cancelled') { connectedData.pop(); updateConnectedBadge(); return; }
    alert('保存失败: ' + e.message);
    renderConnectedList();
  });
}

function disconnectModel(idx) {
  var model = connectedData[idx];
  if (!confirm('确定将「' + safe(model.name) + '」移出接入站？')) return;

  connectedData.splice(idx, 1);
  updateConnectedBadge();

  var connContent = JSON.stringify({ models: connectedData, meta: { total: connectedData.length, updated_at: new Date().toISOString().replace('T', ' ').substring(0, 19) } }, null, 2);
  commitFileToGitHub('docs/data/connected.json', connContent, 'chore: disconnect model "' + safe(model.name) + '"').then(function() {
    renderConnectedList();
    alert('已将「' + safe(model.name) + '」移出接入站 ✓');
  }).catch(function(e) {
    if (e === 'cancelled') { connectedData.splice(idx, 0, model); updateConnectedBadge(); return; }
    alert('保存失败: ' + e.message);
    renderConnectedList();
  });
}

function executeManualAdd(overlay) {
  var name = overlay.querySelector('#add-name').value.trim();
  var company = overlay.querySelector('#add-company').value.trim();
  var statusEl = overlay.querySelector('#add-status');

  if (!name) { statusEl.textContent = '⚠️ 请输入模型名称'; return; }
  if (!company) { statusEl.textContent = '⚠️ 请输入公司名称'; return; }

  var today = new Date().toISOString().substring(0, 10);
  var newModel = {
    name: name,
    company: company,
    domestic: overlay.querySelector('#add-domestic').value,
    open_source: overlay.querySelector('#add-opensource').value,
    size: overlay.querySelector('#add-size').value.trim(),
    type: overlay.querySelector('#add-type').value.trim(),
    reasoning: overlay.querySelector('#add-reasoning').value,
    task_type: overlay.querySelector('#add-tasktype').value.trim(),
    website: overlay.querySelector('#add-website').value.trim(),
    note: overlay.querySelector('#add-note').value.trim(),
    release_date: overlay.querySelector('#add-release').value || today,
    created_date: today,
    connected: '',
    workflow_progress: ''
  };

  statusEl.textContent = '正在保存...';
  var target = overlay.querySelector('#add-target').value || 'all';

  ensureAllModelsLoaded().then(function() {
    for (var i = 0; i < allModelsData.length; i++) {
      if (safe(allModelsData[i].name).toLowerCase() === name.toLowerCase()) {
        statusEl.textContent = '⚠️ 总表中已存在「' + name + '」';
        return Promise.reject('duplicate');
      }
    }

    allModelsData.unshift(newModel);
    var commitTasks = [{ path: 'docs/data/all_models.json', content: buildAllModelsContent(), message: 'feat: manually add model "' + name + '"' }];

    if (target === 'daily') {
      currentDailyData.models = currentDailyData.models || [];
      currentDailyData.models.unshift(newModel);
      commitTasks.push({ path: getCurrentDailyGitHubPath() || 'docs/data/daily_report.json', content: buildDailyContent(), message: 'feat: manually add daily model "' + name + '"' });
    }

    return commitFilesSequentially(commitTasks).then(function() {
      if (tabsLoaded.all) filterAllModels();
      if (target === 'daily') renderDailyReport(currentDailyData);
      statusEl.textContent = '✓ 已添加「' + name + '」';
      setTimeout(function() { overlay.remove(); }, 1500);
    });
  }).catch(function(e) {
    if (e === 'duplicate') return;
    if (e === 'cancelled') { statusEl.textContent = '已取消'; return; }
    statusEl.textContent = '保存失败: ' + (e.message || e) + '\n(本地已添加但未同步GitHub)';
    if (tabsLoaded.all) filterAllModels();
    if (target === 'daily') renderDailyReport(currentDailyData);
  });
}

/* ===== Smart Add (智能添加 via GitHub Actions) ===== */
function showSmartAddModal(target) {
  target = target || 'all';
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-box" style="max-width:520px;">' +
    '<h3>&#x1F916; 智能添加' + (target === 'daily' ? '到日报' : '') + '</h3>' +
    '<input type="hidden" id="smart-add-target" value="' + target + '" />' +
    '<p>粘贴链接、新闻文本或模型名称，系统将通过 AI 自动解析并提取模型信息，查重后添加到总表和对应日报中。</p>' +
    '<p style="color:var(--orange);font-size:.8rem;">⏱ 提交后约 1-2 分钟处理完成，届时刷新页面查看。</p>' +
    '<textarea class="smart-add-textarea" id="smart-add-input" placeholder="支持以下输入格式：\n• 一个或多个 URL（每行一个）\n• 新闻报道文本\n• 模型名称（如 Gemini 3.5 Flash）\n\n系统会自动判断是否为新模型并提取信息。"></textarea>' +
    '<div id="smart-add-status" style="font-size:.85rem;color:var(--text-sec);min-height:20px;"></div>' +
    '<div class="btn-row"><button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn-primary" onclick="executeSmartAdd(this.closest(\'.modal-overlay\'))">提交到后台处理</button></div>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#smart-add-input').focus();
}

function executeSmartAdd(overlay) {
  var input = overlay.querySelector('#smart-add-input').value.trim();
  var target = overlay.querySelector('#smart-add-target').value || 'all';
  var statusEl = overlay.querySelector('#smart-add-status');

  if (!input) { statusEl.textContent = '⚠️ 请输入内容'; return; }
  if (input.length > 5000) { statusEl.textContent = '⚠️ 输入内容过长（最多5000字符）'; return; }

  statusEl.textContent = '正在提交...';

  // 触发 GitHub Actions workflow_dispatch
  getGitHubToken().then(function(token) {
    return fetch('https://api.github.com/repos/' + GITHUB_REPO + '/actions/workflows/smart-add.yml/dispatches', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        ref: GITHUB_BRANCH,
        inputs: {
          content: input,
          target: target
        }
      })
    });
  }).then(function(r) {
    if (r.status === 204 || r.ok) {
      statusEl.innerHTML = '✓ <strong>已成功提交！</strong><br>GitHub Actions 正在后台处理，约 1-2 分钟后刷新页面查看结果。';
      setTimeout(function() { overlay.remove(); }, 4000);
    } else {
      return r.json().then(function(data) { throw new Error(data.message || 'HTTP ' + r.status); });
    }
  }).catch(function(e) {
    if (e === 'cancelled') { statusEl.textContent = '已取消'; return; }
    statusEl.textContent = '提交失败: ' + (e.message || e);
  });
}

function populateTypeFilter() {
  var types = {};
  for (var i = 0; i < allModelsData.length; i++) {
    var t = safe(allModelsData[i].type);
    if (t) types[t] = true;
  }
  var sel = document.getElementById('filter-type');
  var keys = Object.keys(types).sort();
  var html = '<option value="">类型</option>';
  for (var i = 0; i < keys.length; i++) {
    html += '<option value="' + escapeHtml(keys[i]) + '">' + escapeHtml(keys[i]) + '</option>';
  }
  sel.innerHTML = html;
}

function filterAllModels() {
  var search = (document.getElementById('search-input').value || '').toLowerCase();
  var domestic = document.getElementById('filter-domestic').value;
  var opensource = document.getElementById('filter-opensource').value;
  var type = document.getElementById('filter-type').value;

  filteredModels = [];
  for (var i = 0; i < allModelsData.length; i++) {
    var m = allModelsData[i];
    if (search && safe(m.name).toLowerCase().indexOf(search) === -1) continue;
    if (domestic && safe(m.domestic) !== domestic) continue;
    if (opensource && safe(m.open_source) !== opensource) continue;
    if (type && safe(m.type) !== type) continue;
    filteredModels.push(m);
  }

  if (sortColumn) {
    sortModels(sortColumn, sortDirection, false);
  }

  currentPage = 1;
  document.getElementById('table-count').textContent = '显示 ' + filteredModels.length + ' / ' + allModelsData.length + ' 条';
  renderAllTable();
}

function setTableMode(mode) {
  tableMode = mode;
  var btns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
  }
  if (mode === 'paged') btns[0].classList.add('active');
  else btns[1].classList.add('active');
  currentPage = 1;
  renderAllTable();
}

function sortModels(column, direction, toggle) {
  if (toggle) {
    if (sortColumn === column) {
      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      sortColumn = column;
      sortDirection = 'asc';
    }
    direction = sortDirection;
  } else {
    sortColumn = column;
    sortDirection = direction;
  }

  filteredModels.sort(function(a, b) {
    var va = safe(a[column]);
    var vb = safe(b[column]);
    if (va === '' && vb === '') return 0;
    if (va === '') return 1;
    if (vb === '') return -1;
    if (va < vb) return direction === 'asc' ? -1 : 1;
    if (va > vb) return direction === 'asc' ? 1 : -1;
    return 0;
  });

  if (toggle) {
    currentPage = 1;
    renderAllTable();
  }
}

var TABLE_COLUMNS = [
  { key: 'name', label: '模型名称' },
  { key: 'company', label: '公司' },
  { key: 'domestic', label: '国内外' },
  { key: 'open_source', label: '开闭源' },
  { key: 'size', label: '尺寸' },
  { key: 'type', label: '类型' },
  { key: 'reasoning', label: '能否推理' },
  { key: 'task_type', label: '任务类型' },
  { key: 'website', label: '官网' },
  { key: 'note', label: '备注' },
  { key: 'release_date', label: '发布时间' },
  { key: 'created_date', label: '创建时间' },
  { key: '_action', label: '操作' }
];

function renderAllTable() {
  var container = document.getElementById('all-table-container');
  var paginationEl = document.getElementById('all-pagination');

  var models = filteredModels;
  var startIdx = 0;
  var endIdx = models.length;

  if (tableMode === 'paged') {
    startIdx = (currentPage - 1) * pageSize;
    endIdx = Math.min(startIdx + pageSize, models.length);
  }

  var COL_CLASSES = { name:'col-name', company:'col-company', domestic:'col-domestic', open_source:'col-opensource', size:'col-size', type:'col-type', reasoning:'col-reasoning', task_type:'col-tasktype', website:'col-website', note:'col-note', release_date:'col-release', created_date:'col-created', _action:'col-action' };
  var html = '<table class="data-table"><thead><tr>';
  for (var c = 0; c < TABLE_COLUMNS.length; c++) {
    var col = TABLE_COLUMNS[c];
    var cls = COL_CLASSES[col.key] || '';
    if (col.key === '_action') { html += '<th class="' + cls + '">' + col.label + '</th>'; continue; }
    var arrowClass = '';
    if (sortColumn === col.key) arrowClass = sortDirection;
    html += '<th class="' + cls + '" onclick="sortModels(\'' + col.key + '\', \'\', true)">' + col.label + '<span class="sort-arrow ' + arrowClass + '"></span></th>';
  }
  html += '</tr></thead><tbody>';

  for (var i = startIdx; i < endIdx; i++) {
    var m = models[i];
    html += '<tr>';
    html += '<td class="col-name">' + escapeHtml(safe(m.name)) + '</td>';
    html += '<td class="col-company">' + renderCompanyBadge(safe(m.company)) + '</td>';
    html += '<td class="col-domestic">' + renderDomesticBadge(safe(m.domestic)) + '</td>';
    html += '<td class="col-opensource">' + renderOpenSourceBadge(safe(m.open_source)) + '</td>';
    html += '<td class="col-size">' + escapeHtml(safe(m.size)) + '</td>';
    html += '<td class="col-type">' + renderTypeBadge(safe(m.type)) + '</td>';
    html += '<td class="col-reasoning">' + escapeHtml(safe(m.reasoning)) + '</td>';
    html += '<td class="col-tasktype">' + escapeHtml(safe(m.task_type)) + '</td>';
    html += '<td class="col-website">' + renderWebsiteLink(safe(m.website)) + '</td>';
    html += '<td class="col-note">' + escapeHtml(safe(m.note)) + '</td>';
    html += '<td class="col-release">' + escapeHtml(safe(m.release_date)) + '</td>';
    html += '<td class="col-created">' + escapeHtml(safe(m.created_date)) + '</td>';
    html += '<td class="col-action"><button class="delete-btn-cell" onclick="deleteModel(' + i + ')">删除</button> <button class="connect-btn-cell" onclick="connectModel(' + i + ')">接入</button></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';

  if (tableMode === 'inline') {
    container.innerHTML = '<div class="inline-table-wrapper">' + html + '</div>';
    paginationEl.innerHTML = '';
  } else {
    container.innerHTML = '<div class="table-wrapper">' + html + '</div>';
    renderPagination(paginationEl, models.length);
  }
}

function renderWorkflow(val) {
  if (!val) return '';
  if (val === '1' || val === '1.0') return '<span style="color:#10b981;font-size:14px">&#9989;</span>';
  if (val === '0' || val === '0.0') return '<span style="color:#94a3b8;font-size:14px">&#11036;</span>';
  return escapeHtml(val);
}

function renderCompanyBadge(val) {
  if (!val) return '';
  return '<span class="badge" style="background:' + hashColor(val) + ';color:' + hashColorText(val) + '">' + escapeHtml(val) + '</span>';
}

function renderDomesticBadge(val) {
  if (!val) return '';
  if (val === '国内') return '<span class="badge badge-domestic">国内</span>';
  if (val === '国外') return '<span class="badge badge-foreign">国外</span>';
  return escapeHtml(val);
}

function renderOpenSourceBadge(val) {
  if (!val) return '';
  if (val === '开源') return '<span class="badge badge-open">开源</span>';
  if (val === '闭源') return '<span class="badge badge-closed">闭源</span>';
  return escapeHtml(val);
}

function renderTypeBadge(val) {
  if (!val) return '';
  return '<span class="badge badge-type">' + escapeHtml(val) + '</span>';
}

function renderWebsiteLink(val) {
  if (!val) return '';
  return '<a href="' + escapeHtml(val) + '" target="_blank" rel="noopener">链接</a>';
}

function renderPagination(el, total) {
  var totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  var html = '';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? 'disabled' : '') + '>&laquo; 上一页</button>';

  var startPage = Math.max(1, currentPage - 3);
  var endPage = Math.min(totalPages, currentPage + 3);

  if (startPage > 1) {
    html += '<button class="page-btn" onclick="goPage(1)">1</button>';
    if (startPage > 2) html += '<span style="padding:6px;color:#94a3b8">...</span>';
  }
  for (var p = startPage; p <= endPage; p++) {
    html += '<button class="page-btn ' + (p === currentPage ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += '<span style="padding:6px;color:#94a3b8">...</span>';
    html += '<button class="page-btn" onclick="goPage(' + totalPages + ')">' + totalPages + '</button>';
  }

  html += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页 &raquo;</button>';
  el.innerHTML = html;
}

function goPage(page) {
  var totalPages = Math.ceil(filteredModels.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderAllTable();
  document.getElementById('tab-all').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ===== Dashboard ===== */
function loadDashboard() {
  fetch('data/dashboard.json').then(function(r) { return r.json(); }).then(function(data) {
    renderDashboard(data);
  }).catch(function() {
    document.getElementById('dash-stats').innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>加载仪表盘失败</p></div>';
  });
}

function renderDashboard(data) {
  var byDomestic = data.by_domestic || {};
  var domesticCount = byDomestic['国内'] || 0;
  var foreignCount = byDomestic['国外'] || 0;

  var statsHtml = '';
  statsHtml += '<div class="stat-card"><div class="stat-num">' + (data.total || 0) + '</div><div class="stat-label">模型总数</div></div>';
  statsHtml += '<div class="stat-card"><div class="stat-num">' + (data.recent_7d || 0) + '</div><div class="stat-label">近 7 天新增</div></div>';
  statsHtml += '<div class="stat-card"><div class="stat-num">' + domesticCount + '</div><div class="stat-label">国内模型</div></div>';
  statsHtml += '<div class="stat-card"><div class="stat-num">' + foreignCount + '</div><div class="stat-label">国外模型</div></div>';
  document.getElementById('dash-stats').innerHTML = statsHtml;

  // Trend chart
  var trend = data.trend || [];
  var trendLabels = [];
  var trendValues = [];
  for (var i = 0; i < trend.length; i++) {
    trendLabels.push(trend[i].month || '');
    trendValues.push(trend[i].count || 0);
  }

  if (trendChartInstance) trendChartInstance.destroy();
  var trendCtx = document.getElementById('chart-trend').getContext('2d');
  trendChartInstance = new Chart(trendCtx, {
    type: 'bar',
    data: {
      labels: trendLabels,
      datasets: [{
        label: '新增模型数',
        data: trendValues,
        backgroundColor: 'rgba(79, 70, 229, 0.7)',
        borderColor: '#4f46e5',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });

  // Type donut
  var byType = data.by_type || {};
  var typeLabels = [];
  var typeValues = [];
  var sortedTypes = Object.keys(byType).sort(function(a, b) { return byType[b] - byType[a]; });
  var topTypes = sortedTypes.slice(0, 8);
  var otherCount = 0;
  for (var i = 0; i < sortedTypes.length; i++) {
    if (i < 8) {
      typeLabels.push(sortedTypes[i]);
      typeValues.push(byType[sortedTypes[i]]);
    } else {
      otherCount += byType[sortedTypes[i]];
    }
  }
  if (otherCount > 0) {
    typeLabels.push('其他');
    typeValues.push(otherCount);
  }

  var typeColors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6', '#ec4899', '#14b8a6', '#94a3b8'];

  if (typeChartInstance) typeChartInstance.destroy();
  var typeCtx = document.getElementById('chart-type').getContext('2d');
  typeChartInstance = new Chart(typeCtx, {
    type: 'doughnut',
    data: {
      labels: typeLabels,
      datasets: [{
        data: typeValues,
        backgroundColor: typeColors.slice(0, typeLabels.length),
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { padding: 12, font: { size: 12 } } }
      }
    }
  });
}

/* ===== Sources ===== */
function loadSources() {
  fetch('data/site_meta.json').then(function(r) { return r.json(); }).then(function(data) {
    renderSources(data);
  }).catch(function() {
    document.getElementById('source-grid').innerHTML = '<div class="empty-state"><div class="icon">🔗</div><p>加载数据源失败</p></div>';
  });
}

function renderSources(data) {
  var sources = data.data_sources || [];
  var grid = document.getElementById('source-grid');
  var html = '';
  for (var i = 0; i < sources.length; i++) {
    var src = sources[i];
    var statusCls = src.status === 'active' ? 'status-active' : 'status-suspended';
    var statusText = src.status === 'active' ? '运行中' : '已暂停';
    html += '<div class="source-card">';
    html += '<h3>' + escapeHtml(safe(src.name)) + ' <span class="badge ' + statusCls + '">' + statusText + '</span></h3>';
    html += '<p class="desc">' + escapeHtml(safe(src.description)) + '</p>';
    if (safe(src.url)) html += '<a class="source-link" href="' + escapeHtml(src.url) + '" target="_blank" rel="noopener">访问链接 &rarr;</a>';

    if (src.sub_sources && src.sub_sources.length > 0) {
      html += '<div class="sub-sources"><h4>子数据源</h4>';
      for (var j = 0; j < src.sub_sources.length; j++) {
        var sub = src.sub_sources[j];
        html += '<div class="sub-source-item">';
        if (safe(sub.url)) {
          html += '<a href="' + escapeHtml(sub.url) + '" target="_blank" rel="noopener">' + escapeHtml(safe(sub.name)) + '</a>';
        } else {
          html += '<strong>' + escapeHtml(safe(sub.name)) + '</strong>';
        }
        if (safe(sub.description)) html += ' &mdash; ' + escapeHtml(safe(sub.description));
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
  }
  grid.innerHTML = html;
}

/* ===== README ===== */
function loadReadme() {
  fetch('data/site_meta.json').then(function(r) { return r.json(); }).then(function(data) {

    document.getElementById('readme-body').innerHTML = '<div class="empty-state"><div class="icon">📄</div><p>加载 README 失败</p></div>';
  });
}

/* ===== Actions (Review + Push) ===== */
function triggerReview() {
  var meta = currentDailyData.meta || {};
  var since = safe(meta.since).replace(/-/g, '');
  var until = safe(meta.until).replace(/-/g, '');
  var msg = '即将触发「巡检修正」：调用 LLM 审核当前日报，移除不属于时间窗口的模型并修正错误。\n\n时间范围：' + (since || '自动') + ' ~ ' + (until || '自动') + '\n\n确认后会直接触发 GitHub Actions。';
  if (!confirm(msg)) return;

  getGitHubToken().then(function(token) {
    return fetch('https://api.github.com/repos/' + GITHUB_REPO + '/actions/workflows/review-daily.yml/dispatches', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        ref: GITHUB_BRANCH,
        inputs: {
          since: since,
          until: until
        }
      })
    });
  }).then(function(r) {
    if (r.status === 204 || r.ok) {
      alert('已触发巡检修正 workflow ✓\n约 1-2 分钟后刷新页面查看结果。');
    } else {
      return r.json().then(function(data) { throw new Error(data.message || 'HTTP ' + r.status); });
    }
  }).catch(function(e) {
    if (e === 'cancelled') return;
    alert('触发失败: ' + (e.message || e));
  });
}

function triggerPush() {
  var msg = '即将触发「推送钉钉」：将当前日报推送到钉钉群。\n\n确认后将跳转到 GitHub Actions 手动触发页面。';
  if (confirm(msg)) {
    window.open('https://github.com/yqiu07/ai-models-tracker-site/actions/workflows/push-dingtalk.yml', '_blank');
  }
}
